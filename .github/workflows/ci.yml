name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# TD-06: every job here is a required deterministic gate. No API keys, no external
# model or tooling dependencies, no continue-on-error. Credential-dependent
# integration suites stay out of this workflow on purpose. Node is pinned through
# .nvmrc so PR CI and the release workflow cannot drift apart.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck:audit
      - run: npm run typecheck:app
      - run: npm run typecheck:tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Errors fail here. The warning count is held by the debt ratchet (check:debt, eslint.maxWarnings), whose cap was
      # raised on purpose (scripts/technical-debt-budget.json `raises`), so a zero-warning rule could never pass.
      - run: npm run lint
      - run: npm run check:score-editor-globals

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Application build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Compiles the client bundle, which no other job does. A module that resolves
      # for Node and jsdom but not for a browser -- `node:crypto` reached through a
      # service import, say -- passes typecheck, lint and the whole unit suite and
      # still leaves the app unable to load. Measured at ~70 s from a cold cache.
      #
      # `next build` directly rather than `npm run build`, so the `prebuild` hook's
      # check:wasm does not drag Git LFS into every PR: the WASM artifacts are fetched
      # at runtime, not bundled, so the compile does not need them. Release still
      # checks them, with `lfs: true`.
      #
      # SKIP_NEXT_TYPECHECK because the typecheck job already covers types; this job
      # exists for module resolution and bundling.
      - name: Build application
        run: npx next build --webpack
        env:
          SKIP_NEXT_TYPECHECK: '1'
          NODE_OPTIONS: --max-old-space-size=4096

  bridge:
    name: webmscore bridge audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:bridge

  debt:
    name: Technical debt ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: check:debt compares the budget file against the PR's target branch
      # to prove no budget was raised, which a shallow checkout cannot see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:debt
