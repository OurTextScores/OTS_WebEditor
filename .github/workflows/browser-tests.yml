name: Browser tests

# Playwright, sharded. Pull requests and pushes to main run Chromium; the nightly
# run (and a manual dispatch) adds Firefox and WebKit. See AGENTS.md ("Long or
# cross-browser Playwright runs") and docs/engine/PHASE9_2026-10-25.md for what
# each browser's results do and do not prove: Playwright's Firefox build has no
# optimizing WebAssembly compiler, so it checks correctness, not timing.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 02:00 in Vancouver (PDT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: ${{ matrix.browser }} ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      PLAYWRIGHT_PORT: '3013'
      CI: 'true'
    steps:
      # The engine's WASM/data artifacts are Git LFS objects.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Firefox and WebKit need an audio output on headless runners for their
      # AudioContext to resume. Chromium supplies its own fake output.
      - name: Audio sink for Firefox and WebKit
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
      # The soundfont is served from a CDN in production and is not in git; the
      # playback specs load it from public/soundfonts like a local checkout.
      - name: Soundfont
        run: |
          mkdir -p public/soundfonts
          curl -fsSL --retry 3 -o public/soundfonts/default.sf3 https://cdn.ourtextscores.com/soundfonts/default.sf3
      - name: Playwright (shard ${{ matrix.shard }}/4)
        run: |
          if [ "$PLAYWRIGHT_BROWSER" = firefox ]; then
            npx playwright test tests/note-entry-duration.spec.ts tests/note-input-mode.spec.ts tests/playback-session.spec.ts tests/score-geometry-inspection.spec.ts tests/tool-strip.spec.ts tests/toolbar-hit-targets.spec.ts tests/transpose-tied-note.spec.ts tests/undo-history.spec.ts -g 'enters a note at the duration|N resolves a logical start|toolbar duration and accidental|editor Stop invalidates|opt-in inspection follows|hairpin item adds|Hairpins menu adds|octave up and down on one note|straight after an edit|Undo and Redo buttons'
          else
            npx playwright test tests/tool-strip.spec.ts -g 'hides a section, keeps the quick row' --repeat-each=4
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
